<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЗМК МОСТ: ЖУРНАЛ</title>
    
    <!-- 1. Сначала Bootstrap (база) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 2. Потом шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- 3. ГЛАВНОЕ: Наши стили с !important, чтобы перебить всё остальное -->
    <style>
        /* Принудительно задаем фон страницы */
        body {
            background-color: #0f172a !important; /* Глубокий темно-синий */
            color: #f1f5f9 !important;           /* Светлый текст */
            font-family: 'Inter', sans-serif !important;
            min-height: 100vh;
            margin: 0;
        }

        /* Шапка */
        .navbar {
            background-color: #1e293b !important;
            border-bottom: 1px solid #334155 !important;
            padding: 1rem 2rem !important;
        }

        .navbar-brand {
            color: #fbbf24 !important; /* Жёлтый логотип */
            font-weight: 800 !important;
            text-transform: uppercase !important;
        }

        /* Контейнер */
        .container-fluid {
            padding-top: 2rem !important;
            padding-left: 2rem !important;
            padding-right: 2rem !important;
        }

        /* Заголовок страницы */
        .page-header h2 {
            color: #f1f5f9 !important;
            margin-bottom: 0.5rem !important;
        }
        .page-header small {
            color: #94a3b8 !important;
        }

        /* Таблица - самое важное место */
        .table-container {
            background-color: #1e293b !important;
            border-radius: 0.5rem !important;
            border: 1px solid #334155 !important;
            overflow: hidden !important;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3) !important;
        }

        /* Заголовки таблицы */
        .table thead th {
            background-color: #0f172a !important;
            color: #94a3b8 !important;
            border-bottom: 2px solid #334155 !important;
            text-transform: uppercase !important;
            font-size: 0.75rem !important;
            padding: 1rem !important;
        }

        /* Строки таблицы */
        .table tbody tr {
            border-bottom: 1px solid #334155 !important;
            transition: all 0.2s !important;
        }

        /* Чётные и нечётные строки (чтобы не было сплошного белого пятна) */
        .table tbody tr:nth-child(even) {
            background-color: #1e293b !important;
        }
        .table tbody tr:nth-child(odd) {
            background-color: #1e3a5f !important; /* Чуть темнее для контраста */
        }

        /* Наведение на строку */
        .table tbody tr:hover {
            background-color: #334155 !important;
            transform: scale(1.001) !important;
        }

        /* Ячейки */
        .table td {
            color: #f1f5f9 !important; /* Убираем серый полупрозрачный текст */
            padding: 1rem !important;
            border: none !important;
        }

        /* Поле поиска и инпуты */
        .search-box, .form-control {
            background-color: #0f172a !important;
            border-color: #334155 !important;
            color: #f1f5f9 !important;
            padding: 0.5rem 1rem !important;
        }
        .search-box:focus, .form-control:focus {
            outline: none !important;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2) !important;
            border-color: #fbbf24 !important;
        }

        /* Кнопки */
        .btn-custom {
            border: none !important;
            border-radius: 0.375rem !important;
            font-weight: 600 !important;
            text-transform: uppercase !important;
        }
        .btn-primary-custom {
            background-color: #fbbf24 !important;
            color: #000 !important;
        }
        .btn-primary-custom:hover {
            background-color: #fcd34d !important;
            transform: translateY(-2px) !important;
        }
        .btn-outline-custom {
            border-color: #334155 !important;
            color: #94a3b8 !important;
        }
        .btn-outline-custom:hover {
            border-color: #fbbf24 !important;
            color: #fbbf24 !important;
            background: rgba(251, 191, 36, 0.1) !important;
        }

        /* Бейджи статусов */
        .status-badge {
            background-color: #0f172a !important;
            color: #94a3b8 !important;
            border: 1px solid #334155 !important;
            padding: 0.25rem 0.75rem !important;
            border-radius: 999px !important;
        }
        .status-badge.success {
            color: #86efac !important;
            border-color: #86efac !important;
        }

        /* Иконки действий */
        .action-btn {
            width: 32px !important;
            height: 32px !important;
            padding: 0 !important;
            border-radius: 6px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            color: #94a3b8 !important;
            background: transparent !important;
        }
        .action-btn:hover {
            background-color: #fbbf24 !important;
            color: #000 !important;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('index') }}">ЗМК МОСТ: ЖУРНАЛ</a>
        <div class="ms-auto">
            {% if is_admin %}
            <a href="{{ url_for('add', admin='true') }}" class="btn btn-custom btn-primary-custom me-2">
                Новая запись
            </a>
            <span class="badge bg-warning text-dark px-3 py-2 rounded-pill" style="font-weight: 700; font-size: 0.75rem;">
                Режим Админа
            </span>
            {% else %}
            <a href="{{ url_for('index', admin='true') }}" class="btn btn-custom btn-outline-custom">Войти как админ</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container-fluid">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
