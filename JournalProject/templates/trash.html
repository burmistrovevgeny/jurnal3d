<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Корзина</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
 body{background:#0f172a!important;color:#f1f5f9;font-family:'Segoe UI',sans-serif;margin:0}
 .header-bar{background:#1e293b;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155}
 .logo{color:#fbbf24;font-weight:800;text-transform:uppercase}
 .container-main{padding:2rem;max-width:1400px;margin:0 auto}
 .table{background:transparent!important}
 .table thead th{background:#0f172a!important;color:#94a3b8!important;text-transform:uppercase;font-size:.75rem;padding:1rem;border-bottom:2px solid #334155}
 .table tbody td{background:#1e293b!important;color:#f1f5f9!important;padding:.85rem 1rem!important;border-bottom:1px solid #334155;border-left:1px solid #334155}
 .table tbody td:first-child{border-left:none}
 .table tbody tr:nth-child(even) td{background:#1e3a5f!important}
</style></head><body>
<div class="header-bar"><div class="logo">КОРЗИНА</div>
 <a href="/{% if is_admin %}?admin=true{% endif %}" class="btn btn-outline-light btn-sm">← В журнал</a></div>
<div class="container-main">
 <div class="table-wrapper"><table class="table mb-0"><thead><tr>
  <th>№ ЗАКАЗА</th><th>СОТРУДНИК</th><th>ДАТА</th><th>ОБЪЕКТ</th><th>УДАЛЕНО</th><th class="text-end">ДЕЙСТВИЯ</th>
 </tr></thead><tbody>
 {% for row in journal_data %}
  <tr><td style="color:#fbbf24;font-weight:700">{{ row.order_num }}</td>
   <td>{{ row.employee or '—' }}</td><td>{{ row.scan_date or '—' }}</td><td>{{ row.object_name or '—' }}</td>
   <td style="color:#94a3b8">{{ (row.deleted_at or '')[:16].replace('T',' ') }}</td>
   <td class="text-end">
    <button class="btn btn-outline-success btn-sm" onclick="act('/restore/{{row.id}}','Восстановлено')">Восстановить</button>
    <button class="btn btn-outline-danger btn-sm" onclick="act('/purge/{{row.id}}','Удалено безвозвратно')"
            {% if not is_admin %}disabled{% endif %}>Навсегда</button>
   </td></tr>
 {% else %}<tr><td colspan="6" class="text-center py-4">Корзина пуста</td></tr>{% endfor %}
 </tbody></table></div>
</div>
<script>
async function act(p,msg){ if(!confirm('Выполнить?')) return;
  const r = await fetch(p + '?admin=true', {method:'POST',headers:{'Content-Type':'application/json'}});
  if(r.ok){ alert(msg); location.reload(); } else alert('Ошибка: ' + r.status); }
</script></body></html>
